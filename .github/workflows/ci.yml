name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-openapi.mjs

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run check
      # The sticker example has no dependencies; syntax validation still guards
      # its complete server-side API-key search and asset-resolution flow.
      - run: npm run check
        working-directory: stickers-node

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: python -m pip install -r python/requirements.txt
      - run: python -m py_compile python/run.py
      # The dependency-free Sticker Runtime example is checked separately so it
      # remains useful as a transparent HTTP-contract reference beside the SDK.
      - run: python -m py_compile stickers-python/run.py

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - run: go test ./...

  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php -l run.php

  webhooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webhooks/node-express/package-lock.json
      - run: npm ci
        working-directory: webhooks/node-express
      - run: npm run check
        working-directory: webhooks/node-express
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webhooks/python-fastapi/requirements.txt
      - run: python -m pip install -r webhooks/python-fastapi/requirements.txt
      - run: python -m py_compile webhooks/python-fastapi/app.py
